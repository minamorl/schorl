[package]
name = "schorl-capture"
description = "Linux 側の出力から実フレームを取る capability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rustix = { version = "1", features = ["event", "fs", "mm", "shm"] }
schorl-core.workspace = true
schorl-display.workspace = true
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[dev-dependencies]
schorl-verify.workspace = true

[lints]
workspace = true
